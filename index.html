<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Educational Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    /* Theme Variables */
    :root {
      --bg-color: #f2f4f8;
      --glass-bg: rgba(255, 255, 255, 0.32);
      --glass-border: rgba(255, 255, 255, 0.7);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --glass-inset: inset 0 1px 1px rgba(255, 255, 255, 0.7);
      --text-main: #0f172a;
      --text-sub: #334155;
      --btn-sub-bg: rgba(255, 255, 255, 0.5);
      --option-bg: #ffffff;
    }

    body.dark {
      --bg-color: #0b1120;
      --glass-bg: rgba(15, 23, 42, 0.4);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      --glass-inset: inset 0 1px 1px rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --btn-sub-bg: rgba(255, 255, 255, 0.12);
      --option-bg: #1e293b;
    }

    /* Base Layout */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      transition: background 0.3s ease;
    }

    model-viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      outline: none;
      z-index: 1;
    }

    /* Reusable iOS Glass Style */
    .glass {
      pointer-events: auto;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-inset);
      transition: all 0.25s ease;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 18px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }

    .selector-container {
      padding: 5px;
      border-radius: 35px;
      display: flex;
      align-items: center;
      position: relative;
    }

    #model-selector {
      background: transparent;
      padding: 8px 34px 8px 16px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      border: none;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    #model-selector option {
      background: var(--option-bg);
      color: var(--text-main);
    }

    .selector-container::after {
      content: '▼';
      font-size: 10px;
      color: var(--text-sub);
      position: absolute;
      right: 15px;
      pointer-events: none;
    }

    #theme-toggle {
      position: absolute;
      right: 16px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: var(--text-main);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Bottom UI Stack */
    .bottom-ui {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 100;
      pointer-events: none;
    }

    .info-card {
      width: 100%;
      max-width: 360px;
      padding: 14px 18px;
      border-radius: 24px;
    }

    .info-card h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .info-card p {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.4;
    }

    #audio-btn {
      background: var(--btn-sub-bg);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(12px);
    }

    #ar-button {
      color: var(--text-main);
      padding: 13px 32px;
      border-radius: 35px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
      cursor: pointer;
    }

    #theme-toggle:active, #audio-btn:active, #ar-button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="top-bar">
    <div class="selector-container glass">
      <select id="model-selector" onchange="changeModel(this.value)">
        <option value="heart.glb">❤️ Human Heart</option>
        <option value="lungs.glb">🫁 Human Lungs</option>
        <option value="solar.glb">🪐 Solar System</option>
        <option value="dna.glb">🧬 DNA Helix</option>
      </select>
    </div>
    <button id="theme-toggle" class="glass" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
  </div>

  <!-- 3D Viewer -->
  <model-viewer id="viewer" src="heart.glb" alt="3D Model Viewer"
    camera-controls auto-rotate shadow-intensity="1" autoplay
    ar ar-modes="webxr scene-viewer quick-look">
    <button slot="ar-button" style="display: none;"></button>
  </model-viewer>

  <!-- Bottom Info & AR Trigger -->
  <div class="bottom-ui">
    <div class="info-card glass">
      <h2 id="info-title">Human Heart</h2>
      <p id="info-desc">The human heart is a muscular organ that pumps blood through the cardiovascular system, delivering oxygen to the body.</p>
      <button id="audio-btn" onclick="playAudio()">🔊 Listen to facts</button>
    </div>

    <button id="ar-button" class="glass" onclick="viewer.activateAR()">
      View in your space
    </button>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const infoTitle = document.getElementById('info-title');
    const infoDesc = document.getElementById('info-desc');
    const themeToggle = document.getElementById('theme-toggle');

    const modelData = {
      'heart.glb': {
        title: 'Human Heart',
        desc: 'The human heart is a muscular organ that pumps blood through the cardiovascular system, delivering oxygen to the body.'
      },
      'lungs.glb': {
        title: 'Human Lungs',
        desc: 'The lungs are the center of the respiratory system. They allow us to breathe in oxygen and exhale carbon dioxide.'
      },
      'solar.glb': {
        title: 'Solar System',
        desc: 'Our solar system consists of the Sun and the celestial objects bound to it by gravity, including eight planets.'
      },
      'dna.glb': {
        title: 'DNA Double Helix',
        desc: 'Deoxyribonucleic acid (DNA) is a molecule that carries the genetic instructions used in growth and reproduction.'
      }
    };

    function changeModel(modelFile) {
      viewer.src = modelFile;
      infoTitle.innerText = modelData[modelFile].title;
      infoDesc.innerText = modelData[modelFile].desc;
      window.speechSynthesis.cancel();
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      themeToggle.innerText = isDark ? '☀️' : '🌙';
    }

    function playAudio() {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(infoDesc.innerText);
      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => v.lang === 'en-GB' || v.lang === 'en-IN') || voices[1];

      if (preferredVoice) utterance.voice = preferredVoice;
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  </script>
</body>
</html>
