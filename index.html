<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Heart Test</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #f0f0f0; }
    #ar-button {
      background: #014BAA;
      color: white;
      border: none;
      padding: 12px 24px;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <model-viewer src="heart.glb" alt="Human heart"
    camera-controls auto-rotate
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed"
    style="width:100%;height:100%">
    
    <button id="ar-button" slot="ar-button">
      View in your space 🚪
    </button>
  </model-viewer>
</body>
</html>
