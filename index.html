<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Educational Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    /* Updated background color */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f0f0; font-family: system-ui, -apple-system, sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    
    /* Top Dropdown */
    .selector-container {
      position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 6px; border-radius: 35px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4); z-index: 100; display: flex; align-items: center;
    }
    #model-selector {
      background: transparent; padding: 10px 36px 10px 18px; border-radius: 30px; font-size: 15px;
      font-weight: 600; color: #1e293b; border: none; outline: none; cursor: pointer; appearance: none;
    }
    .selector-container::after { content: '▼'; font-size: 10px; color: #64748b; position: absolute; right: 18px; pointer-events: none; }

    /* New Floating Info Card */
    .info-card {
      position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 350px; background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5); z-index: 100;
    }
    .info-card h2 { margin: 0 0 8px 0; font-size: 18px; color: #0f172a; }
    .info-card p { margin: 0 0 15px 0; font-size: 14px; color: #475569; line-height: 1.5; }
    
    /* Audio Button */
    #audio-btn {
      background: #e2e8f0; color: #1e293b; border: none; padding: 8px 16px;
      border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    #audio-btn:active { background: #cbd5e1; }

    /* AR Button */
    #ar-button {
      background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none;
      padding: 14px 30px; position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
      border-radius: 35px; font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4); z-index: 100;
    }
  </style>
</head>
<body>

  <div class="selector-container">
    <select id="model-selector" onchange="changeModel(this.value)">
      <option value="heart.glb">❤️ Human Heart</option>
      <option value="lungs.glb">🫁 Human Lungs</option>
      <option value="solar.glb">🪐 Solar System</option>
      <option value="dna.glb">🧬 DNA Helix</option>
    </select>
  </div>

  <!-- New Info Card -->
  <div class="info-card">
    <h2 id="info-title">Human Heart</h2>
    <p id="info-desc">The human heart is a muscular organ that pumps blood through the cardiovascular system, delivering oxygen to the body.</p>
    <button id="audio-btn" onclick="playAudio()">🔊 Listen to facts</button>
  </div>

  <model-viewer id="viewer" src="heart.glb" alt="3D Model Viewer"
    camera-controls auto-rotate shadow-intensity="1" autoplay
    ar ar-modes="webxr scene-viewer quick-look">
    <button id="ar-button" slot="ar-button">View in your space 🚪</button>
  </model-viewer>

  <script>
    // Data dictionary for the info card
    const modelData = {
      'heart.glb': { 
        title: 'Human Heart', 
        desc: 'The human heart is a muscular organ that pumps blood through the cardiovascular system, delivering oxygen to the body.' 
      },
      'lungs.glb': { 
        title: 'Human Lungs', 
        desc: 'The lungs are the center of the respiratory system. They allow us to breathe in oxygen and exhale carbon dioxide.' 
      },
      'solar.glb': { 
        title: 'Solar System', 
        desc: 'Our solar system consists of the Sun and the celestial objects bound to it by gravity, including eight planets.' 
      },
      'dna.glb': { 
        title: 'DNA Double Helix', 
        desc: 'Deoxyribonucleic acid (DNA) is a molecule that carries the genetic instructions used in growth and reproduction.' 
      }
    };

    // Update 3D viewer and info card when dropdown changes
    function changeModel(modelFile) {
      document.getElementById('viewer').src = modelFile;
      document.getElementById('info-title').innerText = modelData[modelFile].title;
      document.getElementById('info-desc').innerText = modelData[modelFile].desc;
      window.speechSynthesis.cancel(); // Stop audio if playing
    }

    // Web Speech API Text-to-Speech Engine
    function playAudio() {
      window.speechSynthesis.cancel(); // Reset
      const textToRead = document.getElementById('info-desc').innerText;
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.rate = 0.9; // Slightly slower for clear dictation
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
