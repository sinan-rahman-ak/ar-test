<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Anatomy Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    
    /* Cool Floating Glassmorphism Container */
    .selector-container {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px;
      border-radius: 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      z-index: 100;
      display: flex;
      align-items: center;
    }

    #model-selector {
      background: transparent;
      padding: 10px 36px 10px 18px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      border: none;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    /* Custom Dropdown Arrow */
    .selector-container::after {
      content: '▼';
      font-size: 10px;
      color: #64748b;
      position: absolute;
      right: 18px;
      pointer-events: none;
    }

    /* Premium AR Button */
    #ar-button {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 14px 30px;
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 35px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
      z-index: 100;
      transition: transform 0.2s ease;
    }

    #ar-button:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
</head>
<body>

  <!-- Cool Floating Dropdown -->
  <div class="selector-container">
    <select id="model-selector" onchange="document.getElementById('viewer').src = this.value">
      <option value="heart.glb">❤️ Human Heart Model</option>
      <option value="lungs.glb">🫁 Human Lungs Model</option>
      <option value="solar.glb">🪐 Solar System (Animated)</option>
      <option value="DNA.glb">🧬 DNA Double Helix</option>
    </select>
  </div>

  <!-- Model Viewer Element -->
  <model-viewer id="viewer" src="heart.glb" alt="Anatomy Model"
    camera-controls auto-rotate shadow-intensity="1"
    ar ar-modes="webxr scene-viewer quick-look">
    
    <button id="ar-button" slot="ar-button">
      View in your space
    </button>
  </model-viewer>

</body>
</html>
